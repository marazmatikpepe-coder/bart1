<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121828">
<script>try{var t=localStorage.bart_theme;if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Bart — ИИ-ассистент</title>
<link rel="icon" href="https://i.ibb.co/1pCX2Nr/image-Photoroom.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="auth" class="screen" hidden>
  <div class="card">
    <img class="logo" src="https://i.ibb.co/1pCX2Nr/image-Photoroom.png" alt="Bart">
    <h1>Bart</h1><p class="sub">ИИ-ассистент: текст, код, фото, файлы, картинки</p>
    <div class="tabs"><button data-tab="email" class="on">Почта</button><button data-tab="phone">Телефон</button></div>
    <form id="f-email">
      <input id="em" type="email" placeholder="Почта" autocomplete="email" required>
      <input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
      <div class="row"><button class="btn" type="submit">Войти</button><button class="btn alt" type="button" id="reg">Регистрация</button></div>
      <a id="reset">Забыли пароль?</a>
    </form>
    <form id="f-phone" hidden>
      <input id="ph" type="tel" placeholder="+7 999 123-45-67" autocomplete="tel">
      <input id="cd" type="text" inputmode="numeric" placeholder="Код из SMS" hidden>
      <button class="btn" type="submit" id="phb">Получить код</button>
    </form>
    <div id="recaptcha"></div>
    <p id="err" class="err"></p>
  </div>
</section>

<section id="verify" class="screen" hidden>
  <div class="card">
    <img class="logo" src="https://i.ibb.co/1pCX2Nr/image-Photoroom.png" alt="">
    <h1>Подтвердите почту</h1>
    <p class="sub">Мы отправили письмо со ссылкой на <b id="vem"></b>. Перейдите по ссылке (проверьте «Спам»), затем вернитесь сюда.</p>
    <button class="btn" id="vok">Я подтвердил</button>
    <div class="row"><button class="btn alt" id="vre">Отправить ещё раз</button><button class="btn alt" id="vout">Выйти</button></div>
    <p id="verr" class="err"></p>
  </div>
</section>

<div id="app" hidden>
  <div id="shade"></div>
  <aside id="side">
    <div class="brand"><img src="https://i.ibb.co/1pCX2Nr/image-Photoroom.png" alt="">Bart</div>
    <button class="btn" id="new"><span data-ic="plus"></span> Новый чат</button>
    <div class="srch"><span data-ic="search"></span><input id="q" placeholder="Поиск по чатам"></div>
    <div id="list"></div>
    <div class="foot"><div><div id="who"></div><small id="dev"></small></div><button class="icb" id="theme" title="Тема" data-ic="theme"></button><button class="icb" id="out" title="Выйти" data-ic="logout"></button></div>
  </aside>
  <main>
    <header><button class="icb" id="menu" data-ic="menu"></button><span id="ttl">Новый чат</span><span class="pill">Bart-beta</span></header>
    <div id="hero">
      <img src="https://i.ibb.co/1pCX2Nr/image-Photoroom.png" alt="">
      <h2>Чем помочь, сэр?</h2>
      <div class="sug"><button>Нарисуй уютный домик в лесу</button><button>Напиши код сайта-визитки</button><button>Разбери мой файл</button><button>Опиши, что на фото</button></div>
    </div>
    <div id="msgs"></div>
    <footer>
      <div id="chips"></div>
      <div class="box">
        <button class="icb" id="clip" data-ic="attachFile" title="Файл"></button>
        <button class="icb" id="cam" data-ic="camera" title="Фото"></button>
        <textarea id="inp" rows="1" placeholder="Напишите сообщение…"></textarea>
        <button class="send" id="go" data-ic="send"></button>
      </div>
      <input type="file" id="fi" multiple hidden>
      <p class="hint">Bart может ошибаться. Проверяйте важное.</p>
      <input type="file" id="ci" accept="image/*" capture="environment" hidden>
    </footer>
  </main>
</div>
<div id="toast" hidden></div>
<div id="modal" hidden><button class="icb" id="mx" data-ic="close"></button><iframe sandbox="allow-scripts"></iframe></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
