<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bart — веб‑ассистент</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js" defer></script>
</head>
<body>
  <!-- ==== HEADER ==== -->
  <header class="brand">
    <img src="https://i.ibb.co/1pCX2Nr/image-Photoroom.png" alt="logo">
    <span>Bart</span>
    <button id="menuBtn" class="ic" data-ic="menu"></button>
  </header>

  <!-- ==== MAIN ==== -->
  <div id="app">
    <!-- SIDE (скрывается на <768px) -->
    <aside id="side">
      <button id="new" class="row btn">
        <i class="ic" data-i="plus"></i> Новый чат
      </button>
      <div class="srch">
        <i class="ic" data-i="search"></i>
        <input type="text" placeholder="Поиск чатов..." id="search">
      </div>
      <div id="list"></div>
    </aside>

    <!-- CHAT -->
    <section id="chat" class="screen">
      <!-- AUTH (показывается только если пользователь не авторизован) -->
      <div id="auth" class="card">
        <img src="https://i.ibb.co/1pCX2Nr/image-Photoroom.png" class="logo" alt="logo">
        <h1>Добро пожаловать</h1>
        <div class="tabs">
          <button id="tabLogin" class="on">Вход</button>
          <button id="tabRegister">Регистрация</button>
        </div>

        <!-- Вход -->
        <form id="loginForm">
          <input type="email" id="loginEmail" placeholder="Email" required>
          <input type="password" id="loginPass" placeholder="Пароль" required>
          <button class="btn" type="submit">Войти</button>
        </form>

        <!-- Регистрация -->
        <form id="registerForm" hidden>
          <input type="email" id="regEmail" placeholder="Email" required>
          <input type="password" id="regPass" placeholder="Пароль (мин. 6 символов)" required>
          <button class="btn" type="submit">Создать аккаунт</button>
        </form>

        <div class="row">
          <button id="googleSignIn" class="btn alt">
            <i class="ic" data-i="google"></i> Войти через Google
          </button>
        </div>

        <div class="err" id="authError"></div>
      </div>

      <!-- Основной чат (скрыт до авторизации) -->
      <div id="chatContainer" hidden class="flex-col">
        <div id="messages" class="flex-1 overflow-auto"></div>

        <!-- Галерея вложений -->
        <div id="gallery" class="gallery"></div>

        <!-- INPUT -->
        <form id="msgForm" class="row">
          <textarea id="msgInput" placeholder="Введите сообщение…" rows="1"></textarea>
          <button id="attachBtn" type="button" class="ic" data-ic="attachFile"></button>
          <button id="sendBtn" type="submit" class="ic" data-ic="send"></button>
        </form>
        <input type="file" id="fileInput" multiple hidden>
      </div>
    </section>
  </div>

  <!-- MODAL (для просмотра изображений) -->
  <div id="modal" hidden class="modal">
    <img id="modalImg" src="" alt="">
    <button id="modalClose" class="ic" data-ic="close"></button>
  </div>
</body>
</html>
